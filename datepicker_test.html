<!DOCTYPE html>
<html>
<head>
    <title>Datepicker Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.css">
</head>
<body>
    <div class="container mt-5">
        <h2>Datepicker Test</h2>
        <div class="mb-3">
            <label>Test Date:</label>
            <input type="text" id="test_date" class="form-control" placeholder="Click to select date">
        </div>
        <div id="log"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#log').html('<p class="text-info">Initializing datepicker...</p>');

            try {
                $('#test_date').datepicker({
                    dateFormat: 'dd/mm/yy',
                    onSelect: function(dateText) {
                        $('#log').append('<p class="text-success">Date selected: ' + dateText + '</p>');
                    }
                });

                $('#log').append('<p class="text-success">Datepicker initialized successfully!</p>');
            } catch (error) {
                $('#log').append('<p class="text-danger">Error: ' + error.message + '</p>');
            }
        });
    </script>
</body>
</html>
